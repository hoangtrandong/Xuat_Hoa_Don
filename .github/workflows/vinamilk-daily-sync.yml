name: Vinamilk daily sync and report

on:
  schedule:
    # 22:00 UTC = 05:00 Asia/Ho_Chi_Minh (UTC+7)
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  sync-and-report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VINAMILK_USERNAME: ${{ secrets.VINAMILK_USERNAME }}
      VINAMILK_PASSWORD: ${{ secrets.VINAMILK_PASSWORD }}
      VINAMILK_SESSION_COOKIE: ${{ secrets.VINAMILK_SESSION_COOKIE }}
      VINAMILK_LIST_SHOP_ID: "10060330"
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: "587"
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM || secrets.SMTP_USERNAME }}
      REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
      SMTP_USE_SSL: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Sync recent Vinamilk orders
        run: python -m scripts.sync_vinamilk_orders

      - name: Sync new Vinamilk products
        run: python -m scripts.sync_vinamilk_products

      - name: Build and send customer report
        run: python -m scripts.report_vinamilk_customers
