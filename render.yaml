services:
  - type: web
    name: dms-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head && python -m scripts.bootstrap_admin_from_env
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: INITIAL_ADMIN_USERNAME
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_FULL_NAME
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: VINAMILK_USERNAME
        sync: false
      - key: VINAMILK_PASSWORD
        sync: false
      - key: VINAMILK_SESSION_COOKIE
        sync: false
