services:
  - type: web
    name: dms-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m playwright install chromium chromium-headless-shell
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: VINAMILK_USERNAME
        sync: false
      - key: VINAMILK_PASSWORD
        sync: false
      - key: VINAMILK_SESSION_COOKIE
        sync: false
