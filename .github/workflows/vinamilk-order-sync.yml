name: Vinamilk order sync daily

on:
  schedule:
    # 00:00 Asia/Ho_Chi_Minh (UTC+7) = 17:00 UTC on the previous day.
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  sync-orders:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VINAMILK_USERNAME: ${{ secrets.VINAMILK_USERNAME }}
      VINAMILK_PASSWORD: ${{ secrets.VINAMILK_PASSWORD }}
      VINAMILK_SESSION_COOKIE: ${{ secrets.VINAMILK_SESSION_COOKIE }}
      VINAMILK_LIST_SHOP_ID: "10060330"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Apply database migrations
        run: |
          set +e
          output=$(python -m alembic upgrade head 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 0 ]; then
            set +e
            current_revision=$(python -c "exec(\"import os\\nfrom sqlalchemy import create_engine, text\\nengine = create_engine(os.environ['DATABASE_URL'])\\nwith engine.connect() as connection:\\n    try:\\n        current = connection.execute(text('SELECT version_num FROM alembic_version LIMIT 1')).scalar()\\n    except Exception as exc:\\n        message = str(exc).lower()\\n        if 'alembic_version' in message and ('does not exist' in message or 'no such table' in message):\\n            current = ''\\n        else:\\n            raise\\nprint(current or '')\")")
            current_status=$?
            missing_revision=$(python -c "import re, sys; output = sys.stdin.read(); patterns = [r\"Can't locate revision identified by '([^']+)'\", r'No such revision or branch \"([^\"]+)\"', r'No such revision \"([^\"]+)\"']; match = next((m for pattern in patterns for m in [re.search(pattern, output, re.IGNORECASE)] if m), None); print(match.group(1) if match else '')" <<< "$output")
            set -e
            if [ -n "$missing_revision" ] \
              && [ "$current_status" -eq 0 ] \
              && [ -n "$current_revision" ] \
              && [ "$missing_revision" = "$current_revision" ] \
              && ! python -m alembic show "$current_revision" >/dev/null 2>&1; then
              echo "Skipping migrations because database is already on unknown revision $current_revision."
            else
              exit "$status"
            fi
          fi

      - name: Sync recent Vinamilk orders
        run: python -m scripts.sync_vinamilk_orders
