name: Vinamilk order sync every 2 hours

on:
  schedule:
    # Every 2 hours, 24/7 (UTC). GitHub can delay scheduled jobs by several minutes.
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  sync-orders:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VINAMILK_USERNAME: ${{ secrets.VINAMILK_USERNAME }}
      VINAMILK_PASSWORD: ${{ secrets.VINAMILK_PASSWORD }}
      VINAMILK_SESSION_COOKIE: ${{ secrets.VINAMILK_SESSION_COOKIE }}
      VINAMILK_LIST_SHOP_ID: "10060330"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Sync recent Vinamilk orders
        run: python -m scripts.sync_vinamilk_orders
