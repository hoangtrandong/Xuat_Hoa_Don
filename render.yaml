services:
  - type: web
    name: dms-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m playwright install chromium chromium-headless-shell
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: VINAMILK_USERNAME
        sync: false
      - key: VINAMILK_PASSWORD
        sync: false
      - key: VINAMILK_SESSION_COOKIE
        sync: false
  - type: cron
    name: dms-vinamilk-product-sync
    env: python
    rootDir: backend
    schedule: "0 22 * * *"
    buildCommand: pip install -r requirements.txt && python -m playwright install chromium chromium-headless-shell
    startCommand: alembic upgrade head && python -m scripts.sync_vinamilk_products
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: VINAMILK_USERNAME
        sync: false
      - key: VINAMILK_PASSWORD
        sync: false
      - key: VINAMILK_SESSION_COOKIE
        sync: false
  - type: cron
    name: dms-vinamilk-customer-report
    env: python
    rootDir: backend
    schedule: "0 22 * * *"
    buildCommand: pip install -r requirements.txt && python -m playwright install chromium chromium-headless-shell
    startCommand: python -m scripts.report_vinamilk_customers
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: VINAMILK_USERNAME
        sync: false
      - key: VINAMILK_PASSWORD
        sync: false
      - key: VINAMILK_SESSION_COOKIE
        sync: false
      - key: VINAMILK_LIST_SHOP_ID
        value: "10060330"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: REPORT_EMAIL_FROM
        sync: false
      - key: REPORT_EMAIL_TO
        sync: false
      - key: SMTP_USE_SSL
        value: "false"
